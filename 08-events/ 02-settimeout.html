<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Async Project</h1>
    <button id="stop">Stop</button>
</body>
<script>
    // perform after the given interval
    setTimeout(() => {
        console.log("Sachin");
    }, 1000);

    const sayMyName = function () {
        console.log("Sachin from function");
    }

    setTimeout(sayMyName, 2000);

    const changeH1Text = function () {
        document.querySelector('h1').innerHTML = "This text is changed via setTimeoOut"
    }

    const h1TimeOut = setTimeout(changeH1Text, 2000);

    document.getElementById('stop').addEventListener('click', function(){
        clearTimeout(h1TimeOut)
        console.log("Stopped by click event using clearTimeout");
    })

    // perform in interval of given interval
</script>
</html>

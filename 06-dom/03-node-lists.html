<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Node Lists</title>
  </head>
  <body style="background-color: black; color: aliceblue"></body>

  <script>
    const div = document.createElement('div')
    console.log(div);
    const h2 = document.createElement('h2')
    console.log(h2);

    div.className = 'main';
    div.id = Math.round(Math.random()*10+1)
    div.setAttribute("title", "genearted title")
    div.style.color = "green"
    div.style.padding = "12px"
    
    // div.innerHTML = "Sachin learning javascript - DOM in HTML"
    let addText = document.createTextNode("Sachin learning javascript - DOM in HTML")
    div.appendChild(addText)

    document.body.appendChild(div)
  </script>
</html>

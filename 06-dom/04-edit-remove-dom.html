<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Remove DOM | JavaScript</title>
  </head>
  <body style="background-color: black; color: white">
    <ul class="languages">
      <li>JavaScript</li>
    </ul>
  </body>
  <script>
    // CREATE
    function addLanguage(langName){
        const li = document.createElement('li');
        li.innerHTML = `${langName}`
        document.querySelector('.languages').appendChild(li)
    }
    addLanguage("Python")
    addLanguage("TypeScript")

    function addOptiLanguage(langName) {
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(langName))
        document.querySelector('.languages').appendChild(li)
    }

    addOptiLanguage("C++")
    addOptiLanguage("C#")
    addOptiLanguage("Java")

    // EDIT
    const secondLang = document.querySelector('li:nth-child(2)')
    // secondLang.innerHTML("python at second")
    const newLi = document.createElement('li')
    newLi.textContent = "Python Edited"
    secondLang.replaceWith(newLi)

    // EDIT
    const fristLang = document.querySelector('li:first-child')
    fristLang.outerHTML = '<li>JavaScrip Editedt</li>'

    // REMOVE
    const lastLang = document.querySelector('li:last-child')
    lastLang.remove()

  </script>
</html>

<!-- The Document Object Model (DOM) is a programming interface for web documents. 
When a browser loads an HTML page, it parses the code and creates an in-memory, hierarchical tree of objects 
that represents the structure of the document */

/* JavaScript uses the DOM to dynamically read, change, add, or delete HTML elements, 
attributes, and styles without requiring a full page reload. */
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DOM Learning</title>
    <style>
        .bg-black{
            background-color: black;
            color: white;
        }
    </style>
</head>
<body class="bg-black">
    <div>
        <h1 id="title" class="heading">DOM Learning on VSCode
            <span style = "display: none;">test text</span>
        </h1>
        <h2>Lorem, ipsum dolor.</h2>
        <h2>Lorem ipsum dolor sit.</h2>
        <h2>Lorem ipsum dolor sit amet.</h2>
        <input type="password" name="" id="">

        <ul>
            <li class="list-item">one</li>
            <li class="list-item">two</li>
            <li class="list-item">three</li>
        </ul>
       
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Explicabo, dolorem?</p>
    </div>
</body>
</html>
